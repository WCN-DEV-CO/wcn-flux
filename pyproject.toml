[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wcn-flux"
version = "0.1.0"
description = "Tiny, backpressure-aware in-process dataflow runtime for Python. Bounded channels, explicit shedding, pluggable scheduler/router seams. Zero dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "WCN Development Co"}]
keywords = ["dataflow","streaming","backpressure","pipeline","reactive","concurrency"]
classifiers = ["License :: OSI Approved :: MIT License","Programming Language :: Python :: 3","Operating System :: OS Independent","Intended Audience :: Developers","Topic :: Software Development :: Libraries"]

[project.urls]
Homepage = "https://github.com/WCN-DEV-CO/wcn-flux"
